
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Your Redeem Code</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f5f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #171717;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 32px 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: clamp(34px, 9vw, 46px);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.15;
    }

    .arrow {
      margin: 15px 0 22px;
      font-size: 42px;
      font-weight: bold;
      color: #16803c;
      animation: bounce 0.8s infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(12px);
      }
    }

    .code-box {
      padding: 20px 10px;
      background: #f7f8fa;
      border: 2px dashed #16803c;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .code {
      font-family: "Courier New", monospace;
      font-size: clamp(23px, 7vw, 30px);
      font-weight: 900;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
      color: #171717;
    }

    .copy-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #16803c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 13px;
      color: #16803c;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>CLAIM NOW</h1>

    <div class="arrow">↓</div>

    <div class="code-box">
      <div class="code" id="redeemCode">BI0YETHA1I8YPQK4</div>
    </div>

    <button class="copy-btn" onclick="copyCode()">
      COPY CODE
    </button>

    <div class="message" id="message"></div>
  </main>

  <script>
    async function copyCode() {
      const code = document.getElementById("redeemCode").textContent;
      const message = document.getElementById("message");

      try {
        await navigator.clipboard.writeText(code);
        message.textContent = "Code copied successfully!";
      } catch (error) {
        const input = document.createElement("textarea");
        input.value = code;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();

        const success = document.execCommand("copy");
        input.remove();

        message.textContent = success
          ? "Code copied successfully!"
          : "Please copy the code manually.";
      }
    }
  </script>

</body>
</html>
