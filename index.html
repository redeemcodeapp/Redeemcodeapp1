<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE REDEEM CODE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
  background:
  radial-gradient(circle at 50% 20%,#1639a0,transparent 45%),
  radial-gradient(circle at 10% 60%,#7200c7,transparent 40%),
  linear-gradient(160deg,#02051c,#090329,#02051c);
  overflow-x:hidden;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px 14px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  font-size:48px;
}

.crown{
  font-size:65px;
  filter:drop-shadow(0 0 15px gold);
}

h1{
  font-size:clamp(48px,13vw,85px);
  font-weight:1000;
  font-style:italic;
  color:white;
  -webkit-text-stroke:2px red;
  text-shadow:0 5px 0 #760000,0 0 20px red;
}

h2{
  font-size:clamp(32px,9vw,62px);
  color:#ffe600;
  font-weight:1000;
  font-style:italic;
  margin-top:12px;
  text-shadow:0 4px 0 #9d2500,0 0 20px orange;
}

.heading{
  padding:15px 0 25px;
  border-bottom:5px solid #ff22db;
  box-shadow:0 10px 25px #a000ff;
}

.counter-box{
  margin:30px 0;
  padding:20px 8px;
  border:4px solid #f500ff;
  border-radius:30px;
  background:#100b35;
  box-shadow:0 0 15px #ff00ff,0 0 30px #a000ff;
}

.counter{
  font-size:clamp(55px,14vw,85px);
  font-weight:1000;
  color:#ffe000;
  text-shadow:0 4px 0 #9b4c00,0 0 20px orange;
}

.claimed{
  font-size:clamp(20px,5vw,32px);
  font-weight:900;
  font-style:italic;
}

/* THREE GOOGLE PLAY GIFT CARDS */

.cards{
  position:relative;
  width:100%;
  height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:15px auto;
}

.gift-card{
  position:absolute;
  width:58%;
  height:290px;
  object-fit:contain;
  border-radius:15px;
  filter:drop-shadow(0 8px 15px rgba(0,0,0,.6));
}

.gift-left{
  transform:translate(-65px,12px) rotate(-9deg) scale(.86);
  z-index:1;
}

.gift-right{
  transform:translate(65px,12px) rotate(9deg) scale(.86);
  z-index:1;
}

.gift-center{
  transform:translateY(-5px) scale(1);
  z-index:3;
}

/* ARROW */

.arrow{
  font-size:75px;
  color:red;
  text-shadow:0 0 15px red,0 0 8px white;
  margin:-5px auto;
}

/* CLICK BUTTON */

.button{
  display:block;
  text-decoration:none;
  background:linear-gradient(#fff94a,#ffdb00,#ffb900);
  color:black;
  font-size:clamp(38px,10vw,60px);
  font-weight:1000;
  font-style:italic;
  padding:20px 5px;
  border-radius:100px;
  border:5px solid white;
  outline:4px solid red;
  box-shadow:0 0 20px yellow,0 12px 0 #a52a00;
  transition:.2s;
}

.button span{color:red}

.button:active{
  transform:translateY(5px);
}

.tap{
  margin-top:20px;
  font-size:14px;
  font-weight:bold;
}

@media(max-width:380px){
  .cards{height:270px}
  .gift-card{height:245px;width:60%}
}
</style>
</head>

<body>

<div class="container">

  <div class="top">
    <span>▶️</span>
    <span>🎁</span>
  </div>

  <div class="crown">👑</div>

  <div class="heading">
    <h1>FREE</h1>
    <h2>REDEEM CODE</h2>
  </div>

  <div class="counter-box">

    <div style="font-size:40px">🟢</div>

    <div class="counter" id="counter">8,903</div>

    <div class="claimed">
      People Have Claimed It!
    </div>

  </div>

  <!-- GOOGLE PLAY IMAGES -->

  <div class="cards">

    <img
      src="https://www.image2url.com/r2/default/images/1794720483131-e3da3d18-d016-4539-9aae-21a747a67691.png"
      class="gift-card gift-left"
      alt="Google Play Gift Card">

    <img
      src="https://www.image2url.com/r2/default/images/1794720483131-e3da3d18-d016-4539-9aae-21a747a67691.png"
      class="gift-card gift-right"
      alt="Google Play Gift Card">

    <img
      src="https://www.image2url.com/r2/default/images/1794720483131-e3da3d18-d016-4539-9aae-21a747a67691.png"
      class="gift-card gift-center"
      alt="Google Play Gift Card">

  </div>

  <div class="arrow">⬇</div>

  <a
    href="https://redeemcodeapp.github.io/Redeemcodeapp2/"
    class="button"
    target="_blank"
    rel="noopener noreferrer">

    CLICK <span>HERE</span>

  </a>

  <div class="tap">
    ☝ TAP THE BUTTON ABOVE
  </div>

</div>

<script>

let count = 8903;
const maxCount = 9000;

function updateCounter(){

    if(count >= maxCount) return;

    let increase = Math.floor(Math.random() * 3) + 1;

    count = Math.min(count + increase, maxCount);

    document.getElementById("counter").innerText =
        count.toLocaleString("en-US");
}

setInterval(updateCounter, 4000);

</script>

</body>
</html>
